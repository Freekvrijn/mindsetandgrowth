<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1240" height="1754" fill="url(#bg2)"/>
  <rect x="50" y="48" width="1140" height="242" rx="34" fill="#0f172a"/>
  <rect x="954" y="92" width="172" height="54" rx="27" fill="#34d399"/>
  <text x="1040" y="127" text-anchor="middle" fill="#064e3b" font-family="Arial, sans-serif" font-size="22" font-weight="700">VERSIE 2</text>
  <text x="92" y="139" fill="#93c5fd" font-family="Arial, sans-serif" font-size="28" font-weight="700" letter-spacing="2">DE AI APK</text>
  <text x="92" y="207" fill="#ffffff" font-family="Arial, sans-serif" font-size="53" font-weight="700">EERST CHECKEN, DAN KIEZEN</text>
  <text x="92" y="256" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="25">12 korte vragen voor een beter en veiliger besluit</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow2)">
    <g transform="translate(62 330)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">1</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wat is het doel?</text><text x="108" y="91" fill="#475569" font-size="21">Voor wie en voor welke keuze</text><text x="108" y="122" fill="#475569" font-size="21">gebruik ik dit antwoord?</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">SITUATIE</text></g>
    <g transform="translate(630 330)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">2</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wat is de stelling?</text><text x="108" y="91" fill="#475569" font-size="21">Schrijf de belangrijkste conclusie</text><text x="108" y="122" fill="#475569" font-size="21">in één zin op.</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">TOULMIN</text></g>
    <g transform="translate(62 530)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">3</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Welk bewijs is er?</text><text x="108" y="91" fill="#475569" font-size="21">Zoek feiten, cijfers, voorbeelden</text><text x="108" y="122" fill="#475569" font-size="21">en meetbare resultaten.</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">GEGEVENS</text></g>
    <g transform="translate(630 530)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">4</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Klopt de uitleg?</text><text x="108" y="91" fill="#475569" font-size="21">Past het bewijs echt bij de</text><text x="108" y="122" fill="#475569" font-size="21">conclusie, zonder grote sprong?</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">RECHTVAARDIGING</text></g>
    <g transform="translate(62 730)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">5</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Is de bron te vinden?</text><text x="108" y="91" fill="#475569" font-size="21">Controleer maker, datum, land,</text><text x="108" y="122" fill="#475569" font-size="21">doelgroep en onderzoek.</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">CONTROLE</text></g>
    <g transform="translate(630 730)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">6</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wat ontbreekt nog?</text><text x="108" y="91" fill="#475569" font-size="21">Welke gegevens zijn nodig om</text><text x="108" y="122" fill="#475569" font-size="21">een goede keuze te maken?</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">MISSENDE INFO</text></g>
    <g transform="translate(62 930)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">7</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Welke aanname zie ik?</text><text x="108" y="91" fill="#475569" font-size="21">Let op altijd, iedereen, nooit,</text><text x="108" y="122" fill="#475569" font-size="21">goedkoop en gegarandeerd.</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">AANNAMES</text></g>
    <g transform="translate(630 930)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">8</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Taak of heel beroep?</text><text x="108" y="91" fill="#475569" font-size="21">Maak van één voorbeeld niet</text><text x="108" y="122" fill="#475569" font-size="21">meteen een brede conclusie.</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">GENERALISATIE</text></g>
    <g transform="translate(62 1130)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">9</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Zie ik een andere kant?</text><text x="108" y="91" fill="#475569" font-size="21">Zoek een tegenargument en een</text><text x="108" y="122" fill="#475569" font-size="21">onafhankelijke tweede bron.</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">FILTERBUBBEL</text></g>
    <g transform="translate(630 1130)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">10</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wordt het extremer?</text><text x="108" y="91" fill="#475569" font-size="21">Let op angst, boosheid en</text><text x="108" y="122" fill="#475569" font-size="21">steeds hardere beweringen.</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">FABELTJESFUIK</text></g>
    <g transform="translate(62 1330)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#2563eb"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">11</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wat als AI fout zit?</text><text x="108" y="91" fill="#475569" font-size="21">Denk aan geld, klanten, mensen</text><text x="108" y="122" fill="#475569" font-size="21">en de naam van het bedrijf.</text><text x="32" y="158" fill="#2563eb" font-size="17" font-weight="700">RISICO</text></g>
    <g transform="translate(630 1330)"><rect width="548" height="180" rx="24" fill="#fff"/><circle cx="58" cy="56" r="31" fill="#059669"/><text x="58" y="66" text-anchor="middle" fill="#fff" font-size="25" font-weight="700">12</text><text x="108" y="53" fill="#0f172a" font-size="25" font-weight="700">Wat besluit ik zelf?</text><text x="108" y="91" fill="#475569" font-size="21">Gebruiken, aanpassen, eerst</text><text x="108" y="122" fill="#475569" font-size="21">testen of stoppen?</text><text x="32" y="158" fill="#059669" font-size="17" font-weight="700">MENSELIJKE CHECK</text></g>
  </g>

  <rect x="62" y="1550" width="1116" height="136" rx="28" fill="#0f172a"/>
  <text x="620" y="1604" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">Kleine twijfel? Eerst testen. Groot risico? Extra controle.</text>
  <text x="620" y="1648" text-anchor="middle" fill="#93c5fd" font-family="Arial, sans-serif" font-size="22">AI geeft een voorstel. Jij bepaalt wat verantwoord is.</text>
  <text x="620" y="1723" text-anchor="middle" fill="#475569" font-family="Arial, sans-serif" font-size="19">AI Marketing- en Salesadviseur - kritische checklist</text>
</svg>
