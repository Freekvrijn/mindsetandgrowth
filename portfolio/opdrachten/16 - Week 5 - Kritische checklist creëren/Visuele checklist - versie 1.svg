<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f4ff"/>
      <stop offset="1" stop-color="#e8f7f2"/>
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#312e81" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1240" height="1754" fill="url(#bg1)"/>
  <rect x="56" y="54" width="1128" height="246" rx="34" fill="#312e81"/>
  <circle cx="1080" cy="126" r="68" fill="#5eead4" opacity="0.92"/>
  <path d="M1051 126l20 20 40-48" fill="none" stroke="#312e81" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="100" y="135" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="3">VERSIE 1</text>
  <text x="100" y="205" fill="#ffffff" font-family="Arial, sans-serif" font-size="58" font-weight="700">STOP. CHECK. KIES.</text>
  <text x="100" y="258" fill="#ddd6fe" font-family="Arial, sans-serif" font-size="27">8 vragen voordat je AI-output gebruikt</text>

  <g font-family="Arial, sans-serif" filter="url(#shadow1)">
    <g transform="translate(70 350)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#8b5cf6"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">1</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Is de stelling duidelijk?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Wat beweert of adviseert AI</text>
      <text x="126" y="142" fill="#514c68" font-size="23">precies?</text>
      <rect x="36" y="185" width="458" height="2" fill="#ede9fe"/>
      <text x="36" y="220" fill="#7c3aed" font-size="20" font-weight="700">TOULMIN: STELLING</text>
    </g>
    <g transform="translate(640 350)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#0f766e"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">2</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Is er echt bewijs?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Zijn er feiten, cijfers of</text>
      <text x="126" y="142" fill="#514c68" font-size="23">goede voorbeelden?</text>
      <rect x="36" y="185" width="458" height="2" fill="#ccfbf1"/>
      <text x="36" y="220" fill="#0f766e" font-size="20" font-weight="700">TOULMIN: GEGEVENS</text>
    </g>
    <g transform="translate(70 630)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#8b5cf6"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">3</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Klopt de tussenstap?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Legt AI goed uit waarom het</text>
      <text x="126" y="142" fill="#514c68" font-size="23">bewijs de conclusie steunt?</text>
      <rect x="36" y="185" width="458" height="2" fill="#ede9fe"/>
      <text x="36" y="220" fill="#7c3aed" font-size="20" font-weight="700">TOULMIN: REDEN</text>
    </g>
    <g transform="translate(640 630)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#0f766e"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">4</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Kun je de bron vinden?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Controleer maker, datum, land</text>
      <text x="126" y="142" fill="#514c68" font-size="23">en manier van onderzoek.</text>
      <rect x="36" y="185" width="458" height="2" fill="#ccfbf1"/>
      <text x="36" y="220" fill="#0f766e" font-size="20" font-weight="700">CONTROLEERBAARHEID</text>
    </g>
    <g transform="translate(70 910)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#8b5cf6"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">5</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Is er een tweede bron?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Vergelijk met een bron die niet</text>
      <text x="126" y="142" fill="#514c68" font-size="23">hetzelfde belang heeft.</text>
      <rect x="36" y="185" width="458" height="2" fill="#ede9fe"/>
      <text x="36" y="220" fill="#7c3aed" font-size="20" font-weight="700">DUBBELE CONTROLE</text>
    </g>
    <g transform="translate(640 910)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#0f766e"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">6</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Zie je de andere kant?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Zoek bewust naar een andere</text>
      <text x="126" y="142" fill="#514c68" font-size="23">mening of uitleg.</text>
      <rect x="36" y="185" width="458" height="2" fill="#ccfbf1"/>
      <text x="36" y="220" fill="#0f766e" font-size="20" font-weight="700">FILTERBUBBEL</text>
    </g>
    <g transform="translate(70 1190)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#8b5cf6"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">7</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Wordt het steeds extremer?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Let op angst, boosheid en</text>
      <text x="126" y="142" fill="#514c68" font-size="23">steeds hardere claims.</text>
      <rect x="36" y="185" width="458" height="2" fill="#ede9fe"/>
      <text x="36" y="220" fill="#7c3aed" font-size="20" font-weight="700">FABELTJESFUIK</text>
    </g>
    <g transform="translate(640 1190)">
      <rect width="530" height="244" rx="28" fill="#ffffff"/>
      <circle cx="70" cy="70" r="36" fill="#0f766e"/>
      <text x="70" y="81" text-anchor="middle" fill="#fff" font-size="30" font-weight="700">8</text>
      <text x="126" y="65" fill="#171331" font-size="28" font-weight="700">Welke aanname zit erin?</text>
      <text x="126" y="108" fill="#514c68" font-size="23">Pas op voor woorden als altijd,</text>
      <text x="126" y="142" fill="#514c68" font-size="23">iedereen en gegarandeerd.</text>
      <rect x="36" y="185" width="458" height="2" fill="#ccfbf1"/>
      <text x="36" y="220" fill="#0f766e" font-size="20" font-weight="700">AANNAMES</text>
    </g>
  </g>

  <rect x="70" y="1492" width="1100" height="178" rx="30" fill="#171331"/>
  <text x="620" y="1554" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="26" font-weight="700">Na de controle</text>
  <g font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="132" y="1590" width="210" height="52" rx="26" fill="#5eead4"/><text x="237" y="1624" fill="#134e4a">GEBRUIKEN</text>
    <rect x="378" y="1590" width="210" height="52" rx="26" fill="#c4b5fd"/><text x="483" y="1624" fill="#312e81">AANPASSEN</text>
    <rect x="624" y="1590" width="210" height="52" rx="26" fill="#fde68a"/><text x="729" y="1624" fill="#78350f">TESTEN</text>
    <rect x="870" y="1590" width="210" height="52" rx="26" fill="#fecaca"/><text x="975" y="1624" fill="#7f1d1d">STOPPEN</text>
  </g>
  <text x="620" y="1717" text-anchor="middle" fill="#514c68" font-family="Arial, sans-serif" font-size="20">AI helpt je denken. Jij blijft verantwoordelijk voor de keuze.</text>
</svg>
