<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Kwartet — leer 24 AI-technieken spelenderwijs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#12142B;
  --bg-soft:#1B1E3D;
  --bg-soft2:#232752;
  --line: rgba(246,244,239,0.14);
  --surface:#F6F4EF;
  --surface2:#EFEBDF;
  --ink:#14162B;
  --ink-soft:#5A5C78;
  --paper-line:#E1DDCF;
  --cream:#F6F4EF;

  --c-ml:#3E63DD;      --c-ml-soft:#3E63DD22;
  --c-dl:#8452D5;      --c-dl-soft:#8452D522;
  --c-cv:#DD8B1E;      --c-cv-soft:#DD8B1E22;
  --c-nlp:#2E9E4F;     --c-nlp-soft:#2E9E4F22;
  --c-data:#1EA7C4;    --c-data-soft:#1EA7C422;
  --c-rl:#D5443E;      --c-rl-soft:#D5443E22;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 85% -10%, #22265A 0%, var(--bg) 55%);
  color:var(--cream);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Sora',sans-serif; font-weight:800; letter-spacing:-0.01em;}
button{font-family:'Inter',sans-serif; cursor:pointer;}
.hidden{display:none !important;}
#app{min-height:100vh; display:flex; flex-direction:column;}

/* ---------- Topbar ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 28px; border-bottom:1px solid var(--line);
  flex-wrap:wrap; gap:12px;
}
.brand{display:flex; align-items:center; gap:10px; font-family:'Sora',sans-serif; font-weight:700; font-size:18px;}
.brand .dot{width:10px;height:10px;border-radius:3px; background:linear-gradient(135deg, var(--c-ml), var(--c-rl)); display:inline-block;}
.nav-links{display:flex; gap:8px;}
.nav-btn{
  background:transparent; border:1px solid var(--line); color:var(--cream);
  padding:9px 16px; border-radius:8px; font-size:14px; font-weight:600;
  transition:background .15s, border-color .15s;
}
.nav-btn:hover{background:var(--bg-soft2); border-color:rgba(246,244,239,0.3);}
.nav-btn.primary{background:var(--cream); color:var(--ink); border-color:var(--cream);}
.nav-btn.primary:hover{background:#fff;}

main{flex:1; display:flex; flex-direction:column;}

/* ---------- HOME ---------- */
.home-wrap{
  flex:1; display:grid; grid-template-columns: 1.1fr 0.9fr; gap:40px;
  align-items:center; padding:50px 60px; max-width:1240px; margin:0 auto; width:100%;
}
.home-copy .eyebrow{color:#A9ACD6; font-size:14px; margin-bottom:14px; font-weight:600;}
.home-copy h1{font-size:52px; line-height:1.04; margin:0 0 18px;}
.home-copy p.lead{color:#C7C9E6; font-size:17px; line-height:1.6; max-width:480px; margin:0 0 28px;}
.home-actions{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:34px;}
.btn-lg{
  padding:14px 24px; border-radius:10px; font-weight:700; font-size:15px; border:1px solid transparent;
}
.btn-lg.solid{background:var(--cream); color:var(--ink);}
.btn-lg.solid:hover{background:#fff;}
.btn-lg.ghost{background:transparent; color:var(--cream); border-color:var(--line);}
.btn-lg.ghost:hover{border-color:rgba(246,244,239,0.35);}
.stat-row{display:flex; gap:26px; flex-wrap:wrap;}
.stat{}
.stat b{display:block; font-family:'Sora',sans-serif; font-size:24px;}
.stat span{color:#9FA2C9; font-size:13px;}

.hero-fan{position:relative; height:360px;}
.hero-card{
  position:absolute; width:190px; height:266px; border-radius:16px; top:40px; left:50%;
  background:var(--surface); box-shadow:0 20px 40px rgba(0,0,0,0.35);
  transform-origin:bottom center; padding:16px; display:flex; flex-direction:column;
  opacity:0; animation:cardIn .55s cubic-bezier(.2,.8,.2,1) forwards;
  border:1px solid rgba(0,0,0,0.06);
}
.hero-card .tag{font-size:11px; font-weight:700; color:#fff; padding:4px 8px; border-radius:5px; width:fit-content;}
.hero-card .icon{font-size:26px; margin:10px 0 4px;}
.hero-card .name{font-family:'Sora',sans-serif; font-weight:700; color:var(--ink); font-size:15px; line-height:1.2;}
.hero-card .fill{flex:1;}
.hero-card .bar{height:6px; border-radius:3px; background:var(--surface2); margin-top:5px;}
@keyframes cardIn{ to{opacity:1;} }
.hc1{transform:translate(-50%,0) rotate(-16deg); animation-delay:.05s;}
.hc2{transform:translate(-50%,0) rotate(-5deg); animation-delay:.15s;}
.hc3{transform:translate(-50%,0) rotate(6deg); animation-delay:.25s;}
.hc4{transform:translate(-50%,0) rotate(17deg); animation-delay:.35s;}

@media (max-width: 880px){
  .home-wrap{grid-template-columns:1fr; padding:30px 22px;}
  .home-copy h1{font-size:38px;}
  .hero-fan{height:260px; margin-top:10px;}
  .hero-card{width:140px; height:196px; top:20px;}
}
/* ---------- BROWSE (Kaartenboek) ---------- */
.browse-wrap{max-width:1100px; margin:0 auto; padding:40px 24px 70px; width:100%;}
.browse-header{margin-bottom:28px;}
.browse-header h2{font-size:30px; margin:0 0 8px;}
.browse-header p{color:#C7C9E6; margin:0; max-width:640px; line-height:1.55;}
.cat-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; margin-top:26px;}
@media (max-width:760px){ .cat-grid{grid-template-columns:1fr;} }
.cat-tile{
  border-radius:14px; padding:20px; cursor:pointer; border:1px solid var(--line);
  background:var(--bg-soft); transition:transform .15s, border-color .15s;
}
.cat-tile:hover{transform:translateY(-3px); border-color:rgba(246,244,239,0.35);}
.cat-tile .icon{font-size:28px;}
.cat-tile h3{font-size:17px; margin:10px 0 4px; font-family:'Sora',sans-serif;}
.cat-tile p{margin:0; font-size:13px; color:#A9ACD6;}
.cat-tile .count{margin-top:12px; font-size:12px; color:#7F82AE;}

.cat-detail{margin-top:10px;}
.cat-detail-head{display:flex; align-items:center; gap:14px; margin-bottom:20px;}
.back-link{background:transparent; border:none; color:#C7C9E6; font-size:14px; font-weight:600; padding:8px 0; display:flex; align-items:center; gap:6px;}
.card-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;}
@media (max-width:760px){ .card-grid{grid-template-columns:1fr;} }

.study-card{background:var(--surface); border-radius:16px; overflow:hidden; color:var(--ink); box-shadow:0 14px 30px rgba(0,0,0,0.25);}
.study-card .head{padding:16px 18px; color:#fff;}
.study-card .head .eyebrow{font-size:12px; opacity:.85; font-weight:600;}
.study-card .head h4{margin:4px 0 0; font-size:19px; font-family:'Sora',sans-serif;}
.study-card .body{padding:16px 18px 20px;}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.field .flabel{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:3px;}
.field p{margin:0; font-size:14px; line-height:1.5;}

/* ---------- GAME ---------- */
.game-wrap{flex:1; display:grid; grid-template-columns: 230px 1fr; gap:0; align-items:start;}
.side-panel{border-right:1px solid var(--line); padding:22px 18px; display:flex; flex-direction:column; gap:14px;}
.opp-card{border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--bg-soft);}
.opp-card.active{border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,0.15) inset;}
.opp-card .name{font-weight:700; font-size:14px; margin-bottom:6px; display:flex; justify-content:space-between;}
.opp-card .name .n{color:#9FA2C9; font-weight:500; font-size:12px;}
.opp-hand{display:flex; gap:3px; flex-wrap:wrap;}
.mini-back{width:16px; height:22px; border-radius:3px; background:linear-gradient(135deg,#3E63DD,#8452D5);}
.opp-sets{display:flex; gap:4px; flex-wrap:wrap; margin-top:8px;}
.set-chip{width:16px; height:16px; border-radius:4px;}

.table-area{padding:20px 26px 30px; display:flex; flex-direction:column; gap:16px; min-width:0;}
.table-top{display:flex; justify-content:space-between; align-items:center;}
.table-top h2{font-size:20px; margin:0;}
.game-log{
  background:var(--bg-soft); border:1px solid var(--line); border-radius:12px; padding:12px 16px;
  height:110px; overflow-y:auto; font-size:13px; color:#C7C9E6; line-height:1.7;
}
.game-log .entry b{color:#fff;}
.action-zone{
  background:var(--bg-soft2); border:1px solid var(--line); border-radius:14px; padding:18px 20px; min-height:120px;
}
.action-zone h3{margin:0 0 12px; font-size:15px; font-family:'Sora',sans-serif;}
.choice-row{display:flex; gap:10px; flex-wrap:wrap;}
.choice-btn{
  background:var(--bg-soft); border:1px solid var(--line); color:var(--cream);
  padding:10px 14px; border-radius:9px; font-size:13.5px; font-weight:600; text-align:left;
  transition:border-color .15s, background .15s;
}
.choice-btn:hover{border-color:rgba(246,244,239,0.4); background:#2A2E5E;}
.choice-btn .sub{display:block; font-weight:400; font-size:11.5px; color:#9FA2C9; margin-top:2px;}

.hand-area{margin-top:6px;}
.hand-label{font-size:13px; color:#9FA2C9; margin-bottom:8px; font-weight:600;}
.hand-row{display:flex; gap:10px; flex-wrap:wrap;}
.pcard{
  width:118px; border-radius:11px; padding:10px; background:var(--surface); color:var(--ink);
  cursor:pointer; border:2px solid transparent; transition:transform .12s, border-color .12s;
}
.pcard:hover{transform:translateY(-4px);}
.pcard.selected{border-color:#fff;}
.pcard .tag{font-size:9.5px; font-weight:700; color:#fff; padding:3px 6px; border-radius:5px; width:fit-content;}
.pcard .icon{font-size:18px; margin:6px 0 3px;}
.pcard .name{font-family:'Sora',sans-serif; font-weight:700; font-size:12px; line-height:1.25;}

/* ---------- MODAL ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(9,10,24,0.72); display:flex; align-items:center; justify-content:center;
  padding:20px; z-index:50;
}
.modal{background:var(--bg-soft); border:1px solid var(--line); border-radius:18px; max-width:640px; width:100%; padding:28px; max-height:86vh; overflow-y:auto;}
.modal h2{margin:0 0 6px; font-size:22px;}
.modal p.lead{color:#C7C9E6; margin:0 0 20px; font-size:14px;}
.modal-close-row{display:flex; justify-content:flex-end; margin-top:22px;}

.quartet-banner{
  display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:12px; margin-bottom:18px; color:#fff;
}
.quartet-banner .icon{font-size:26px;}
.quartet-banner h3{margin:0; font-size:16px; font-family:'Sora',sans-serif;}
.quartet-banner p{margin:2px 0 0; font-size:12.5px; opacity:.9;}

.rules-list{padding-left:20px; margin:0; color:#DFE1F5; font-size:14.5px; line-height:1.85;}
.rules-list li{margin-bottom:6px;}

.footer-note{padding:16px 26px; border-top:1px solid var(--line); font-size:12.5px; color:#8285AB; text-align:center;}

/* ---------- MOBILE OVERRIDES (kept last on purpose so they win the cascade) ---------- */
@media (max-width: 640px){
  .topbar{padding:14px 16px;}
  .nav-links{gap:6px; width:100%;}
  .nav-btn{padding:8px 12px; font-size:13px; flex:1; text-align:center;}
  .brand{font-size:16px;}
  .game-wrap{grid-template-columns:1fr;}
  .side-panel{border-right:none; border-bottom:1px solid var(--line); flex-direction:row; flex-wrap:wrap; padding:14px 14px;}
  .side-panel .opp-card{flex:1; min-width:130px;}
  .table-area{padding:16px 16px 24px;}
  .pcard{width:104px;}
  .hand-row{gap:8px;}
  .choice-row{flex-direction:column;}
  .choice-btn{width:100%;}
  .card-grid{grid-template-columns:1fr;}
  .cat-grid{grid-template-columns:1fr;}
}
</style>
</head>

/* Bouw platte deck van 24 kaarten */
let DECK = [];
CATEGORIES.forEach(cat=>{
  cat.cards.forEach((c,i)=>{
    DECK.push({...c, catId:cat.id, catNaam:cat.naam, catKort:cat.kort, kleur:cat.kleur, icon:cat.icon, uid:cat.id+"-"+i});
  });
});

/* =========================================================================
   APP STATE & ROUTING
   ========================================================================= */
const app = document.getElementById('app');

let browseOpenCat = null;

function go(r){ route = r; render(); window.scrollTo(0,0); }

/* =========================================================================
   GAME STATE
   ========================================================================= */
const PLAYER_NAMES = ["Jij","Bot Nova","Bot Sigma","Bot Iris"];
let G = null; // game state object

function newGame(){
  const deck = shuffle(DECK.map(c=>c));
  const hands = [[],[],[],[]];
  deck.forEach((c,i)=> hands[i%4].push(c));
  G = {
    hands,
    collected:[[],[],[],[]], // array of catIds per player
    turn:0,
    log:[],
    selectedCardUid:null,
    pendingAskTarget:null,
    over:false,
    modalQuartet:null, // {catId, byPlayer}
    busy:false,
  };
  logMsg(`Nieuw spel gestart. Iedereen krijgt 6 kaarten.`);
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function logMsg(html){
  G.log.push(html);
  if(G.log.length>60) G.log.shift();
}

function catInfo(id){ return CATEGORIES.find(c=>c.id===id); }

function missingInCategory(playerIdx, catId){
  const have = G.hands[playerIdx].filter(c=>c.catId===catId).map(c=>c.naam);
  const cat = catInfo(catId);
  return cat.cards.filter(c=> !have.includes(c.naam));
}

function categoriesPlayerCanAsk(playerIdx){
  const owned = new Set(G.hands[playerIdx].map(c=>c.catId));
  return [...owned].filter(catId => missingInCategory(playerIdx, catId).length>0);
}

function checkQuartetComplete(playerIdx, catId){
  const have = G.hands[playerIdx].filter(c=>c.catId===catId);
  if(have.length===4){
    G.hands[playerIdx] = G.hands[playerIdx].filter(c=>c.catId!==catId);
    G.collected[playerIdx].push(catId);
    logMsg(`🎉 <b>${PLAYER_NAMES[playerIdx]}</b> verzamelt het volledige kwartet <b>${catInfo(catId).naam}</b>!`);
    if(playerIdx===0){
      G.modalQuartet = {catId, byPlayer:playerIdx};
    }
    return true;
  }
  return false;
}

function totalCollected(){ return G.collected.reduce((s,a)=>s+a.length,0); }

function nextAlivePlayer(from){
  for(let step=1; step<=4; step++){
    const idx=(from+step)%4;
    if(G.hands[idx].length>0) return idx;
  }
  return -1;
}

function endGameIfNeeded(){
  if(totalCollected()>=6){ G.over=true; return true; }
  // stalemate: active player has cards but no one else does and they can't self-complete
  const activeHasCards = G.hands[G.turn].length>0;
  const anyoneElseHasCards = G.hands.some((h,i)=> i!==G.turn && h.length>0);
  if(activeHasCards && !anyoneElseHasCards){
    // give remaining incomplete groups nowhere to go -> end game
    G.over = true;
    logMsg(`Niemand anders heeft nog kaarten om te vragen — het spel eindigt hier.`);
    return true;
  }
  return false;
}

/* ---- Menselijke speler acties ---- */
function playerSelectCard(uid){
  G.selectedCardUid = (G.selectedCardUid===uid)? null : uid;
  G.pendingAskTarget = null;
  render();
}

function playerChooseCardToAsk(cardName){
  G.pendingCardName = cardName;
  render();
}

function playerAsk(targetIdx, catId, cardName){
  const target = G.hands[targetIdx];
  const idxInTarget = target.findIndex(c=> c.catId===catId && c.naam===cardName);
  logMsg(`Jij vraagt <b>${PLAYER_NAMES[targetIdx]}</b> om de kaart <b>${cardName}</b>.`);
  G.selectedCardUid=null; G.pendingCardName=null;
  render();
  G.busy=true;
  setTimeout(()=>{
    if(idxInTarget>-1){
      const [card] = target.splice(idxInTarget,1);
      G.hands[0].push(card);
      logMsg(`✅ Kloppend! <b>${PLAYER_NAMES[targetIdx]}</b> geeft de kaart aan jou. Je mag opnieuw vragen.`);
      checkQuartetComplete(0, catId);
      G.busy=false;
      if(!endGameIfNeeded()) render(); else render();
    } else {
      logMsg(`❌ Helaas, <b>${PLAYER_NAMES[targetIdx]}</b> heeft die kaart niet. De beurt gaat naar ${PLAYER_NAMES[targetIdx]}.`);
      G.turn = targetIdx;
      G.busy=false;
      if(!endGameIfNeeded()){ render(); maybeRunBotTurn(); } else render();
    }
  }, 700);
}

/* ---- Bot logica (eenvoudige regelgebaseerde agent) ---- */
function botTakeTurn(botIdx){
  if(G.over) return;
  if(G.hands[botIdx].length===0){
    G.turn = nextAlivePlayer(botIdx);
    render();
    if(G.turn!==0) maybeRunBotTurn();
    return;
  }
  const askable = categoriesPlayerCanAsk(botIdx);
  if(askable.length===0){
    // geen enkele categorie om over te vragen (zou zelden voorkomen) -> beurt door
    G.turn = nextAlivePlayer(botIdx);
    render();
    if(G.turn!==0) maybeRunBotTurn();
    return;
  }
  const catId = askable[Math.floor(Math.random()*askable.length)];
  const missing = missingInCategory(botIdx, catId);
  const cardName = missing[Math.floor(Math.random()*missing.length)].naam;

  const otherPlayers = [0,1,2,3].filter(i=> i!==botIdx && G.hands[i].length>0);
  if(otherPlayers.length===0){ G.over=true; render(); return; }
  const targetIdx = otherPlayers[Math.floor(Math.random()*otherPlayers.length)];

  logMsg(`<b>${PLAYER_NAMES[botIdx]}</b> vraagt <b>${PLAYER_NAMES[targetIdx]}</b> om de kaart <b>${cardName}</b>.`);
  render();

  setTimeout(()=>{
    const target = G.hands[targetIdx];
    const idxInTarget = target.findIndex(c=> c.catId===catId && c.naam===cardName);
    if(idxInTarget>-1){
      const [card] = target.splice(idxInTarget,1);
      G.hands[botIdx].push(card);
      logMsg(`✅ Kloppend! <b>${PLAYER_NAMES[botIdx]}</b> krijgt de kaart en mag opnieuw vragen.`);
      checkQuartetComplete(botIdx, catId);
      if(!endGameIfNeeded()){ render(); maybeRunBotTurn(); } else render();
    } else {
      logMsg(`❌ <b>${PLAYER_NAMES[targetIdx]}</b> heeft hem niet. De beurt gaat naar ${PLAYER_NAMES[targetIdx]}.`);
      G.turn = targetIdx;
      if(!endGameIfNeeded()){ render(); maybeRunBotTurn(); } else render();
    }
  }, 900);
}

function maybeRunBotTurn(){
  if(G.over) return;
  if(G.turn===0) return;
  if(G.hands[G.turn].length===0){
    G.turn = nextAlivePlayer(G.turn);
    render();
    if(G.turn!==0 && !G.over) setTimeout(()=>maybeRunBotTurn(), 500);
    return;
  }
  setTimeout(()=> botTakeTurn(G.turn), 650);
}

  btn.className='btn-lg solid'; btn.style.marginTop='16px';
  btn.textContent='Nog een keer spelen';
  btn.onclick=()=>{ newGame(); render(); if(G.turn!==0) maybeRunBotTurn(); };
  el.appendChild(btn);
  return el;
}

function QuartetModal(){
  const cat = catInfo(G.modalQuartet.catId);
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  const modal = document.createElement('div');
  modal.className='modal';
  modal.innerHTML = `
    <div class="quartet-banner" style="background:${cat.kleur}">
      <div class="icon">${cat.icon}</div>
      <div><h3>Kwartet compleet: ${cat.naam}</h3><p>Je hebt alle 4 kaarten verzameld — hier is nog een keer alles wat ze uitleggen.</p></div>
    </div>
    <div id="qm-cards" style="display:flex; flex-direction:column; gap:14px;"></div>
    <div class="modal-close-row"><button class="btn-lg solid" id="qm-close">Verder spelen</button></div>
  `;
  const cardsWrap = modal.querySelector('#qm-cards');
  cat.cards.forEach(c=> cardsWrap.appendChild(StudyCard(c, cat)));
  modal.querySelector('#qm-close').onclick=()=>{
    G.modalQuartet=null;
    render();
    if(!G.over && G.turn!==0) maybeRunBotTurn();
  };
  backdrop.appendChild(modal);
  return backdrop;
}

function showRules(){
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h2>Spelregels</h2>
      <p class="lead">AI Kwartet speel je zoals een klassiek kwartetspel — met 24 kaarten verdeeld over 6 categorieën.</p>
      <ol class="rules-list">
        <li>Alle 24 kaarten worden geschud en verdeeld: jij en 3 bots krijgen elk 6 kaarten.</li>
        <li>Ben jij aan de beurt? Kies een kaart uit je hand van een categorie waar je al minstens 1 kaart van hebt.</li>
        <li>Kies welke ontbrekende kaart uit die categorie je wilt hebben, en aan welke tegenstander je het vraagt.</li>
        <li>Heeft die speler de kaart? Dan krijg jij hem en mag je nog een keer vragen.</li>
        <li>Heeft die speler de kaart niet? Dan gaat de beurt naar die speler.</li>
        <li>Verzamel je alle 4 kaarten van een categorie? Dan leg je dat kwartet neer — én zie je alle 4 kaarten nog eens rustig uitgelegd.</li>
        <li>Het spel is voorbij zodra alle 6 kwartetten verzameld zijn. Wie de meeste kwartetten heeft, wint.</li>
      </ol>
      <div class="modal-close-row"><button class="btn-lg solid" id="rules-close">Begrepen</button></div>
    </div>`;
  backdrop.querySelector('#rules-close').onclick=()=> backdrop.remove();
  document.body.appendChild(backdrop);
}

render();
</script>
</body>
</html>
